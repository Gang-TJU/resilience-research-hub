<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法规政策演进中心</title><style>body{margin:0;background:#f4f7f8;color:#153b50;font:15px/1.6 system-ui,sans-serif}header{background:#153b50;color:white;padding:26px max(20px,calc((100vw - 1120px)/2))}header a{color:white}main{max-width:1120px;margin:auto;padding:20px}section,article{background:white;border:1px solid #dbe5e8;border-radius:8px;padding:16px;margin-bottom:12px}button,input,select{padding:8px;margin:4px;border:1px solid #bdcdd1;background:white;border-radius:5px}button{cursor:pointer}a{color:#176e73}small{color:#546970}h1,h2,h3{margin:0 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f5;padding:10px;font:inherit}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left} .scroll{overflow:auto} .stats{display:flex;flex-wrap:wrap;gap:20px}.stats div{flex:1;min-width:110px}.stats strong{font-size:24px;display:block}</style><header><a href="./">← 科研情报首页</a><h1>法规政策演进中心</h1><div>国家法规 · 部委政策 · 省级政策 · 版本差异与效力追踪</div></header><main><section id="summary">正在读取独立政策档案…</section><section><button data-tab="records">政策法规库</button><button data-tab="versions">新旧版本与政策变化</button><button data-tab="coverage">中央及省级信源覆盖</button><input id="q" placeholder="检索标题、机关、文号、地区"><select id="region"><option value="">全部地区</option></select></section><div id="content"></div></main><script>
const $=i=>document.getElementById(i),E=(t,s,p)=>{let n=document.createElement(t);if(s!=null)n.textContent=s;if(p)p.append(n);return n};let D={records:[],comparisons:[],regions:[],departments:[],latest:{sources:[]}},tab='records',limit=60;
function link(p,x,label){if(!x)return;let a=E('a',label||x.title,p);a.href=x.url;a.target='_blank';a.rel='noopener noreferrer'}
function render(){let p=$('content');p.replaceChildren();let q=$('q').value.toLowerCase(),reg=$('region').value;let rows=D.records.filter(x=>(!reg||x.region===reg)&&[x.title,x.issuer,x.docno,x.region,x.source].join(' ').toLowerCase().includes(q));if(tab==='coverage'){E('h2','覆盖矩阵（已配置不等于采集成功）',p);let box=E('section',null,p);box.className='scroll';let t=E('table',null,box);let tr=E('tr',null,t);for(let x of ['地区',...D.departments])E('th',x,tr);for(let r of ['全国',...D.regions]){if(reg&&r!==reg)continue;let tr=E('tr',null,t);E('td',r,tr);for(let d of D.departments){let ss=D.latest.sources.filter(x=>x.region===r&&(x.department===d||r==='全国'&&x.department.includes(d==='发展改革'?'发展改革':d)));E('td',ss.some(x=>x.status==='ok')?'有匹配':ss.length?'待核实/失败':'未接入或本轮未检查',tr)}}E('h2','本轮信源明细',p);for(let s of D.latest.sources.filter(x=>!reg||x.region===reg)){let a=E('article',null,p);link(a,s,s.source);E('p',s.region+' · '+s.department+' · '+s.status+' · '+s.matched+'条 '+s.note,a)}return}
if(tab==='versions'){let ids=new Set(rows.map(x=>x.id));let pairs=D.comparisons.filter(x=>ids.has(x.old_id)||ids.has(x.new_id));E('h2','版本关联与变化 '+pairs.length+' 组',p);for(let x of pairs){let a=D.records.find(y=>y.id===x.old_id),b=D.records.find(y=>y.id===x.new_id);let c=E('article',null,p);E('h3',b?.title||'政策文本变化',c);E('p',x.relation+' · '+x.basis,c);let s=E('p','旧版：',c);link(s,a,a?.published||'日期待核实');s=E('p','新版：',c);link(s,b,b?.published||'日期待核实');E('p','新版施行：'+(b?.effective||'待核实'),c);if(x.chapter_old?.length){E('h3','旧版章节结构',c);E('p',x.chapter_old.join(' → '),c);E('h3','新版章节结构',c);E('p',x.chapter_new.join(' → '),c)}if(!x.changes.length)E('p','尚无两份满足完整性规则的可比条款正文，不输出推测性增删结论。',c);for(let z of x.changes){let d=E('details',null,c);E('summary',z.operation+' · 旧 '+z.old.length+' / 新 '+z.new.length+' 条',d);E('pre','旧：'+z.old.map(y=>y.article+' '+y.text).join('\n'),d);E('pre','新：'+z.new.map(y=>y.article+' '+y.text).join('\n'),d)}}if(!pairs.length)E('p','暂无符合条件的版本关联。',p);return}
E('h2','政策记录 '+rows.length+' 条',p);for(let x of rows.slice(0,limit)){let a=E('article',null,p);let h=E('h3',null,a);link(h,x);E('small',[x.region,x.issuer||'发文机关待核实',x.kind,x.docno||'文号待核实'].join(' · '),a);E('p','公布/发布：'+(x.published||'待核实')+' ｜ 施行：'+(x.effective||'待核实')+' ｜ '+(x.status_label||'效力待核实'),a);E('p',x.verification+' · '+(x.text_status||'')+(x.error?' · 抓取异常：'+x.error:''),a);if(x.repeals?.length)E('p','原文明确列出的废止文件：'+x.repeals.join('；'),a);if(x.reference)link(a,{url:x.reference},'公布信息补充来源')}if(rows.length>limit){let b=E('button','加载更多',p);b.onclick=()=>{limit+=60;render()}}}
for(let b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;render()};$('q').oninput=render;$('region').onchange=render;fetch('policies.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{D=d;let s=$('summary');s.replaceChildren();E('h2','政策情报与版本统计',s);let bar=E('div',null,s);bar.className='stats';for(let [a,b] of [['政策记录',d.records.length],['明确修订关系',d.comparisons.filter(x=>x.relation==='已核实修订关系').length],['待核实版本候选',d.comparisons.filter(x=>x.relation.includes('候选')).length],['本轮有匹配信源',d.latest.sources.filter(x=>x.status==='ok').length]]){let z=E('div',a,bar);E('strong',b,z)}E('p','最近检查 '+d.latest.checked_at+' · '+d.coverage_note,s);for(let r of ['全国',...d.regions]){let o=E('option',r,$('region'));o.value=r}render()}).catch(e=>{$('summary').textContent='独立政策档案尚未发布：'+e.message});
</script></html>
