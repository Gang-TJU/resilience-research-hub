<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源安全与韧性科研情报站</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#173847;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{background:#153b50;color:white;padding:28px max(20px,calc((100vw - 1180px)/2))}h1{margin:0;font-size:26px}header p{margin:6px 0;color:#cce2e7}main{max-width:1180px;margin:auto;padding:20px;display:grid;grid-template-columns:200px 1fr;gap:20px}nav,section,article{background:white;border:1px solid #dbe5e8;border-radius:8px;padding:16px}nav button{display:block;width:100%;text-align:left;margin:5px 0}button,select,input{padding:8px 10px;border:1px solid #cbd9dd;border-radius:5px;background:white;color:#173847}button{cursor:pointer}button.active{background:#287d78;color:white}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#cards div{background:#e9f2f2;padding:12px;border-radius:6px}#cards strong{display:block;font-size:25px}article{margin:10px 0}a{color:#176e73;text-decoration:none}a:hover{text-decoration:underline}small,.muted{color:#64777d}h2{font-size:19px;margin:5px 0 12px}#filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#q{flex:1;min-width:160px}.bar{height:12px;background:#287d78;border-radius:3px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #e1e8eb}footer{padding:20px;text-align:center;color:#64777d}@media(max-width:700px){main{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}#cards{grid-template-columns:repeat(2,1fr)}}
</style><header><h1>资源安全与韧性科研情报站</h1><p>RESEARCH INTELLIGENCE HUB · 全球文献 / 数据 / 政策 / 新闻</p><small style="color:#cce2e7" id="stamp">读取采集记录…</small></header><main><nav id="nav"><a style="display:block;padding:10px;font-weight:bold" href="policy.html">法规政策演进中心 →</a></nav><div><section><h2 id="heading">今日精选</h2><div id="cards"></div><div id="filters"><input id="q" placeholder="检索标题、来源、主题"><select id="topic"><option value="">全部专题</option></select><select id="sort"><option value="rank">相关性优先</option><option value="new">最近收录</option></select><a href="data.json" download>导出资料 JSON</a></div><div id="content"></div><button id="more" hidden>加载更多</button></section></div></main><footer>规则筛选及统计，非AI导读。仅收录公开元数据与原文入口；请核对原始来源。</footer>
<script>
const $=id=>document.getElementById(id), el=(tag,text,parent)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};let data={items:[],runs:[]},tab='今日精选',limit=40;const tabs=['今日精选','文献','数据','政策','新闻','统计分析','科研简报','运行状态'];const types=['文献','数据','政策','新闻'];
for(const t of tabs){let b=el('button',t,$('nav'));b.onclick=()=>{tab=t;limit=40;render()}}
function render(){ $('heading').textContent=tab;for(const b of $('nav').children)b.classList.toggle('active',b.textContent===tab);$('cards').replaceChildren();for(const t of types){let d=el('div',undefined,$('cards'));el('strong',data.items.filter(x=>x.type===t).length,d);el('span',t,d)}let c=$('content');c.replaceChildren();$('more').hidden=true;$('filters').hidden=!['今日精选',...types].includes(tab);if(tab==='运行状态'){const l=data.latest;if(!l){el('p','尚无运行记录',c);return}for(const s of l.sources){let p=el('article',undefined,c);el('strong',s.source+' · '+s.status,p);el('div','匹配 '+s.matched+' / 新增 '+s.new+' '+s.note,p)}return}
if(tab==='统计分析'){let counts={};for(const x of data.items)counts[x.first_seen]=(counts[x.first_seen]||0)+1;let entries=Object.entries(counts).sort().slice(-30),max=Math.max(1,...entries.map(e=>e[1]));el('p','近30个有新增记录的采集日期（非论文发表趋势）',c);for(const [d,n] of entries){el('small',d+' · '+n,c);let b=el('div',undefined,c);b.className='bar';b.style.width=(n/max*100)+'%'}return}
if(tab==='科研简报'){let l=data.latest;if(!l){el('p','尚无简报',c);return}let end=l.date,start=new Date(end+'T00:00:00Z');start.setUTCDate(start.getUTCDate()-6);let week=start.toISOString().slice(0,10);for(const [title,rows] of [['每日新增',data.items.filter(x=>x.first_seen===end)],['近七日新增',data.items.filter(x=>x.first_seen>=week&&x.first_seen<=end)]]){el('h2',title+' · '+rows.length,c);for(const t of types)el('p',t+'：'+rows.filter(x=>x.type===t).length+' 条',c);for(const x of [...rows].sort((a,b)=>(b.relevance||0)-(a.relevance||0)).slice(0,10)){let a=el('a',x.title,el('p',undefined,c));a.href=x.url;a.rel='noopener noreferrer';a.target='_blank'}}el('p','本次来源异常：'+l.sources.filter(s=>s.status!=='ok').length+'；数量仅代表收录结果，不代表领域整体趋势。',c);return}
let q=$('q').value.toLowerCase(),topic=$('topic').value;let rows=data.items.filter(x=>(tab==='今日精选'||x.type===tab)&&(!topic||x.topics.includes(topic))&&[x.title,x.source,...x.topics].join(' ').toLowerCase().includes(q));rows.sort((a,b)=>$('sort').value==='new'?b.first_seen.localeCompare(a.first_seen)||(b.relevance||0)-(a.relevance||0):(b.relevance||0)-(a.relevance||0)||b.first_seen.localeCompare(a.first_seen));el('p','共 '+rows.length+' 条 · 相关性基于标题关键词，不等同于研究质量',c);for(const x of rows.slice(0,limit)){let p=el('article',undefined,c);el('small',x.type+' · '+x.source+' · '+(x.date||'发布日期待核实'),p);let h=el('h3',undefined,p),a=el('a',x.title,h);a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';el('div',x.topics.join(' · ')||'待分类',p);el('small','首次收录 '+x.first_seen+' | '+(x.metadata.date_type||'')+(x.metadata.future_date?' · 未来卷期/日期，待核实':''),p);if(x.metadata.authors?.length)el('div',x.metadata.authors.join(' · '),p);if(x.matched_phrases?.length)el('small','匹配依据：'+x.matched_phrases.join(' / '),p);if(x.type==='数据'&&x.metadata.access_links?.length){let d=el('div',undefined,p);for(const l of x.metadata.access_links){let z=el('a',l.label,d);z.href=l.url;z.target='_blank';z.rel='noopener noreferrer';z.style.marginRight='14px'}el('div','产品版本：'+(x.metadata.version||'待核实')+' · '+(x.metadata.access_note||''),p);if(x.metadata.version_note)el('div',x.metadata.version_note,p)}}$('more').hidden=rows.length<=limit}
$('sort').onchange=()=>{limit=40;render()};$('q').oninput=()=>{limit=40;render()};$('topic').onchange=()=>{limit=40;render()};$('more').onclick=()=>{limit+=40;render()};fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;$('stamp').textContent=d.latest?'最后检查 '+d.latest.checked_at+' · 本次新增 '+d.latest.new:'尚无采集记录';for(const t of [...new Set(d.items.flatMap(x=>x.topics))].sort()){let o=el('option',t,$('topic'));o.value=t}render()}).catch(e=>{$('stamp').textContent='采集结果尚不可用：'+e.message;render()});
</script></html>
